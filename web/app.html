<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACME IT Helpdesk — Assisted by Pin</title>
  <meta name="description" content="ACME help desk assistant — Pin." />
  <link rel="icon" href="./assets/pin-ticket.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="container header-inner">
        <div class="acme-logo">
            <img src="./assets/acme-logo.png" height="80"/>
          <span class="badge" title="Pin is the assistant behind the scenes">
            <span aria-hidden="true">📌</span>
            <span>assisted by <strong>Pin</strong></span>
          </span>
        </div>

        <div class="header-right">
          <span class="badge" id="userBadge">Signed in</span>
          <button id="adminBtn" class="btn secondary" type="button" style="display:none;">Admin</button>
          <button id="logoutBtn" class="btn secondary" type="button">Logout</button>
        </div>
      </div>
    </header>

    <main>
      <div class="container shell">
        <aside class="card sidebar">
          <div class="nav" role="navigation" aria-label="Primary navigation">
            <button data-view="home" class="active">
              <span>Home</span>
              <span class="count">🏠</span>
            </button>

            <button data-view="newIssue">
              <span>New Chat</span>
              <span class="count">＋</span>
            </button>

            <div class="sidebar-section-title">Chats</div>

            <button data-view="openChats">
              <span>Open</span>
              <span class="count" id="countOpenChats2">0</span>
            </button>

            <button data-view="closedChats">
              <span>Closed</span>
              <span class="count" id="countClosed">0</span>
            </button>

            <div class="sidebar-section-title">Tickets</div>

            <button data-view="openTickets">
              <span>Open</span>
              <span class="count" id="countTickets">0</span>
            </button>

            <button data-view="closedTickets">
              <span>Closed</span>
              <span class="count" id="countClosedTickets">0</span>
            </button>

            <div class="hr"></div>

            <button data-view="profile">
              <span>Profile</span>
              <span class="count">👤</span>
            </button>

            <button data-view="logout">
              <span>Logout</span>
              <span class="count">↩</span>
            </button>
          </div>
        </aside>

        <section class="card main">
          <div class="main-grid">
            <div class="panel" id="primaryPanel"></div>

            <aside class="panel" id="contextPanel">
              <h3>Session Context</h3>
              <div class="kpi" id="kpiPanel"></div>

              <div class="hr"></div>

              <h3>Pin Status</h3>
              <div class="small">
                Prototype mode. Chats and tickets are stored server-side per user.
              </div>
              <div style="margin-top:10px">
                <img src="./assets/pin-ticket.png" alt="Pin mascot with ticket" style="width:100%;height:auto;border-radius:12px;border:1px solid var(--border)" />
              </div>
            </aside>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div class="container footer-inner">
        <div class="footer-left">
          <div class="small"><strong>Meta</strong>: Project <span class="mono">Pin</span> • UI • Build: <span class="mono" id="buildDate"></span></div>
          <div class="small">Company: <span class="mono" id="companyMeta">ACME</span> • User: <span class="mono" id="userMeta"></span> • Storage: <span class="mono">SQLite</span></div>
        </div>
        <div class="footer-right">
          <div class="small"><strong>ACME IT</strong> Help Desk: (555) 010-4242 • helpdesk@acme.example</div>
          <div class="small">© <span id="year"></span> ACME Corporation</div>
        </div>
      </div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
