<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pin — Loading…</title>
  <link rel="icon" href="./assets/pin-noticket.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="login-wrap">
    <main class="login-hero">
      <div class="container">
        <section class="card" style="text-align:center">
          <h1 class="h1" style="margin:0 0 10px">Pin</h1>
          <p class="sub" style="margin:0">Loading…</p>
        </section>
      </div>
    </main>
  </div>

  <script>
    (async () => {
      // Default org for the capstone demo.
      const orgId = "ACME";
      try {
        const r = await fetch(`/api/bootstrap/status?org_id=${encodeURIComponent(orgId)}`);
        const j = await r.json();
        if (j && j.initialized) window.location.href = "./login.html";
        else window.location.href = "./setup.html";
      } catch {
        // If API is unreachable, go to login (still useful for static demo).
        window.location.href = "./login.html";
      }
    })();
  </script>
</body>
</html>
